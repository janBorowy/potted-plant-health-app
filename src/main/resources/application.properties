spring.application.name=sensors-registry
spring.mongodb.host=${MONGO_HOST}
spring.mongodb.authentication-database=${MONGO_AUTH_DB}
spring.mongodb.username=${MONGO_USERNAME}
spring.mongodb.password=${MONGO_PASSWORD}
spring.mongodb.database=${MONGO_DB_NAME}

authorization-server-keys.privateKey=${AUTHORIZATION_SERVER_PRIVATE_KEY}
authorization-server-keys.publicKey=${AUTHORIZATION_SERVER_PUBLIC_KEY}

app.token-expiry-minutes=60
spring.mvc.problemdetails.enabled=true
