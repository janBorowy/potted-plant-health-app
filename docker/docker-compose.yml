services:

  sensor-registry-api:
    build:
      context: ./sensor-registry-api
      args:
        JAR_FILE: sensors-registry-*-SNAPSHOT.jar
    ports:
      - "80:8080"
    env_file:
      - "sensor-registry-api/.env"

  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro

volumes:
  mongo_data:
