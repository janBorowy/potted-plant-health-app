services:

  sensor-registry-api:
    build:
      context: ..
      dockerfile: docker/sensor-registry-api/dockerfile
      args:
        JAR_FILE: build/libs/*-SNAPSHOT.jar
    ports:
      - "8080:8080"
    env_file:
      - "sensor-registry-api/.env"

  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
