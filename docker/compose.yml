services:

  sensor-registry-api:
    image: sensor-registry-api:latest
    ports:
      - "8080:8080"
    env_file:
      - "../.env"

  mongo:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
